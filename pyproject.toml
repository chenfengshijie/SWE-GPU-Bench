[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-gpu-bench"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
description = "Collect, reproduce, and evaluate GPU software tasks for SWE-GPU-Bench"
requires-python = ">=3.12"
dependencies = ["openai>=1.0.0", "pyarrow>=16,<22"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
swe-gpu-bench = "swe_gpu_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
swe_gpu_bench = ["evaluate/resources/*"]
