name: Offline tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra test --python 3.12
      - run: uv run pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: uv build
